onboarding = false
[theme]
name = "dracula"

auto_switch = false
[terminal]
default_shell = "/bin/zsh"

[keys]
# --- Prefix ---
prefix = "ctrl+a"

# --- Pane Navigation (vim-tmux-navigator style) ---
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"

# --- Tab/Window Navigation ---
next_tab = "ctrl+n"
previous_tab = "ctrl+y"

# --- Workspace Navigation ---
next_workspace = "cmd+alt+n"
previous_workspace = "cmd+alt+y"

# --- Window Splitting ---
split_vertical = "prefix+|"
split_horizontal = "prefix+-"

# --- Zoom / Fullscreen ---
zoom = "prefix+z"

# --- Config Reload ---
reload_config = "prefix+r"

# --- Resizing ---
resize_mode = "prefix+shift+r"

open_worktree = "prefix+shift+o"

[ui]
mouse_capture = true
pane_borders = true

show_agent_labels_on_pane_borders = true
[experimental]
pane_history = true

[ui.sound]
enabled = false

[ui.toast]
delivery = "herdr"
